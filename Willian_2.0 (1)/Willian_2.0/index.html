<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación Péndulo Resorte</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Incluir Chart.js para generar la gráfica -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="grid-container">
        <!-- Parte 1: Lo que hiciste (lado izquierdo) -->
        <div class="section" id="section-1">
            <div class="frame">
                <div class="spring"></div>
                <div class="pendulum">
                    <div class="rod"></div>
                    <div class="mass"></div>
                </div>
            </div> 
            <div class="control-box">
                <div class="warning-box">
                    <span>Movimiento</span>
                </div>
                <div class="dropdown">
                    <label for="movement">Puede elegir movimientos:</label>
                    <select id="movement">
                        <option value="simple">Movimiento Armónico Simple</option>
                        <option value="amortiguado">Movimiento Amortiguado</option>
                        <option value="forzado_sin_amortiguamiento">Movimiento Forzado Sin Amortiguamiento</option> 
                        <option value="forzado_amortiguado">Movimiento Forzado Amortiguado</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Parte 2: Controles para modificar los valores -->
        <div class="section" id="section-2">
            <h2>Modificar Parámetros</h2>
            
            <label for="longitudPendulo">Longitud del péndulo (l) en (m):</label>
            <input type="number" id="longitudPendulo" min="1" max="10" value="1">

            <label for="masaPendulo">Masa del péndulo (m) en (kg):</label>
            <input type="number" id="masaPendulo" min="1" max="10" value="1">

            <label for="constanteElastica">Constante elástica del resorte (k) en (N/m):</label>
            <input type="number" id="constanteElastica" min="1" max="20" value="3">
            
            <label for="anguloInicial">angulo inicial(tetha0) en (rads): </label>
            <input type="number" id="anguloInicial"min="0" value="0.24">

            <label for="velocidadInicialPendulo">Velocidad Angular Inicial(0'o) en (rad/s):</label>
            <input type="number" id="velocidadInicialPendulo" value="0">

            <label for="coeficienteAmortiguamiento">Coeficiente de Amortiguamiento (b) en Ns/m:</label>
            <input type="number" id="coeficienteAmortiguamiento"min="0.1" value="0.1">           

            <label for="frecuenciaExterna"> Amplitud de Fuerza Externa (F<sub>0</sub>): <span class="span" id="amplitudfuerza-value"></span></label>
            <input type="range" id="amplitudfuerza" min="0" max="4" step="0.01" value="1" class="custom-range">

            <laber for="frecuenciafuerzaExterna">Frecuencia de la Fuerza Externa (W<sub>f</sub> ): <span class="span" id="frecuenciafuerzaExterna-value"></span></laber>
            <input type="range" id="frecuenciafuerzaExterna" min="0.01" max="1" value="0.02" step="0.01" class="custom-range">

            <button id="calculateBtn">Generar Simulación</button>
        </div>

        <!-- Parte 3: Mostrar gráfica x vs t-->
        <div class="section" id="section-3">
            <div id="chart-container-angle">
                <h2>Pendulo: Ángulo (θ) vs Tiempo (t)</h2>
                <canvas id="angleChart" width="700" height="400"></canvas> <!-- Gráfica de ángulo -->
            </div>
            <div id="chart-container-velocity">
                <h2>Pendulo: Ángulo (θ) vs Tiempo (t)</h2>
                <canvas id="velocityChart" width="700" height="400"></canvas> <!-- Gráfica de ángulo -->
            </div>
        </div>

        <!-- Parte 4: Cuarta sección -->
        <div class="section" id="section-4">
            <h2>Formula</h2>
            <div id="Formula">
                <p id="ContenidoFormula">Formula</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
